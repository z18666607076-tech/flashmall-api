services:
  app:
    image: flashmall-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: FlashMall
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # Local demo key only. Override this outside of Docker Compose.
      APP_KEY: "base64:AXi+IBFffA0Fn1oNU1TQHTkEA9B1Rag+sMjInD17x8I="
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: flashmall
      DB_USERNAME: flashmall
      DB_PASSWORD: secret
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WECHAT_DRIVER: fake
      WECHAT_MINI_PROGRAM_APP_ID: ""
      WECHAT_MINI_PROGRAM_SECRET: ""
      CATALOG_CACHE_TTL: 600
      ORDER_UNPAID_TTL_SECONDS: 900
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  worker:
    image: flashmall-app
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: ["php", "artisan", "queue:work", "redis", "--queue=orders,default", "--sleep=1", "--tries=3", "--no-interaction"]
    environment:
      APP_NAME: FlashMall
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: "base64:AXi+IBFffA0Fn1oNU1TQHTkEA9B1Rag+sMjInD17x8I="
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: flashmall
      DB_USERNAME: flashmall
      DB_PASSWORD: secret
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WECHAT_DRIVER: fake
      WECHAT_MINI_PROGRAM_APP_ID: ""
      WECHAT_MINI_PROGRAM_SECRET: ""
      CATALOG_CACHE_TTL: 600
      ORDER_UNPAID_TTL_SECONDS: 900
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: flashmall
      MYSQL_USER: flashmall
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-testing-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
