# Production stack tuned for a 4 vCPU / 4 GB RAM VPS.
# Secrets come from .env.prod on the server. That file is not committed.
# Start with: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build

name: flashmall

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  app:
    image: flashmall-app:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        PHP_EXTENSION_INSTALLER: ${PHP_EXTENSION_INSTALLER:-mlocati/php-extension-installer:2}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 800m
    restart: unless-stopped
    <<: *logging

  caddy:
    image: flashmall-caddy:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: web
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.4-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2}
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
        PHP_EXTENSION_INSTALLER: ${PHP_EXTENSION_INSTALLER:-mlocati/php-extension-installer:2}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        COMPOSER_MIRROR: ${COMPOSER_MIRROR:-}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-on}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/up"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 128m
    restart: unless-stopped
    <<: *logging

  horizon:
    image: flashmall-app:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
    user: www-data
    entrypoint: ["php", "artisan", "horizon"]
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 400m
    restart: unless-stopped
    <<: *logging

  scheduler:
    image: flashmall-app:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile.prod
      target: app
    user: www-data
    entrypoint: ["php", "artisan", "schedule:work"]
    env_file:
      - ${ENV_FILE:-.env.prod}
    environment:
      <<: *app-env
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 180m
    restart: unless-stopped
    <<: *logging

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-flashmall}
      MYSQL_USER: ${DB_USERNAME:-flashmall}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.prod}
    command:
      - --innodb-buffer-pool-size=512M
      - --max-connections=80
      - --performance-schema=OFF
      - --table-open-cache=400
      - --innodb-redo-log-capacity=134217728
      - --skip-mysqlx
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1100m
    shm_size: 128m
    restart: unless-stopped
    <<: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 320m
    restart: unless-stopped
    <<: *logging

volumes:
  mysql_data:
  redis_data:
  caddy_data:
  caddy_config:
  storage:
